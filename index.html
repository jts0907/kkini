<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>끼니 — 영양 기록</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="끼니">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<style>
:root{
  --p:#059669; --c:#2563eb; --f:#ea580c; --kcal:#334155;
  --bg:#f7f8fa; --card:#ffffff; --ink:#1e293b; --sub:#64748b;
  --line:#e2e8f0; --line2:#f1f5f9; --warn:#dc2626; --ok:#059669;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:15px;line-height:1.4}
body{max-width:520px;margin:0 auto;padding-bottom:130px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);padding:14px 16px 12px}
.hd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd-title{font-size:16px;font-weight:700;letter-spacing:-.02em}
.hd-date{font-size:12px;color:var(--sub);margin-left:6px;font-weight:400}
.hd-btns{display:flex;gap:4px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tot-kcal{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.tot-kcal b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.tot-kcal .goal{font-size:13px;color:var(--sub)}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--line2);margin-bottom:9px}
.bar i{display:block;height:100%}
.bar .bp{background:var(--p)} .bar .bc{background:var(--c)} .bar .bf{background:var(--f)}
.macros{display:flex;gap:13px}
.macro{display:flex;align-items:center;gap:5px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dp{background:var(--p)} .dc{background:var(--c)} .df{background:var(--f)}
.macro b{font-weight:700}
.macro .g{color:var(--sub);font-weight:400}
.macro span.lbl{color:var(--sub)}

.tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--bg);position:sticky;top:0;z-index:10}
.tab{flex:1;padding:9px 0;text-align:center;font-size:13.5px;font-weight:600;
  color:var(--sub);background:none;border:none;border-radius:9px;cursor:pointer}
.tab.on{color:var(--ink);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}

.searchwrap{padding:10px 16px 4px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  font-size:15px;background:var(--card);outline:none}
.search:focus{border-color:var(--c)}

.list{padding:4px 16px 8px}
.hint{color:var(--sub);font-size:13px;text-align:center;padding:32px 20px;line-height:1.6}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.row-main{flex:1;min-width:0}
.row-name{font-size:14px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11.5px;color:var(--sub);margin-top:3px}
.row-sub .k{color:var(--kcal);font-weight:600}
.row-sub .mp{color:var(--p)} .row-sub .mc{color:var(--c)} .row-sub .mf{color:var(--f)}
.star{font-size:19px;line-height:1;background:none;border:none;cursor:pointer;color:var(--line);padding:2px;flex:none}
.star.on{color:#f59e0b}
.add{flex:none;width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;
  background:var(--c);color:#fff;font-size:20px;line-height:1}
.src{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;
  background:var(--line2);color:var(--sub);margin-left:5px;vertical-align:middle}

.today{padding:4px 16px}
.today h2{font-size:13px;color:var(--sub);font-weight:700;margin:14px 2px 8px}
.meal-group{margin-bottom:14px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 2px 6px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.meal-name{font-size:13px;font-weight:700}
.meal-sub{font-size:11px;color:var(--sub)}
.titem{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.ti-main{flex:1;min-width:0}
.ti-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-sub{font-size:11px;color:var(--sub);margin-top:2px}
.ti-macros{font-size:11px;margin-top:2px}
.ti-macros .mp{color:var(--p)} .ti-macros .mc{color:var(--c)} .ti-macros .mf{color:var(--f)}
.del{background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px;flex:none}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px}

.fab{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:15}
.fab button{width:100%;padding:13px;border-radius:12px;border:1px dashed var(--line);
  background:var(--card);color:var(--sub);font-size:14px;font-weight:600;cursor:pointer}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;
  display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;
  border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.sheet .msub{font-size:12px;color:var(--sub);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}
.field input:focus{border-color:var(--c)}
.meal-pick{display:flex;gap:6px;margin-bottom:12px}
.meal-pick button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;background:var(--card);
  font-size:13px;cursor:pointer;color:var(--ink);font-weight:600}
.meal-pick button.on{border-color:var(--c);color:var(--c);background:#eff6ff}
.qbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qbtn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12.5px;cursor:pointer;color:var(--ink)}
.qbtn.on{border-color:var(--c);color:var(--c);background:#eff6ff}
.calc{background:var(--bg);border-radius:10px;padding:10px 12px;margin:6px 0 14px;font-size:12.5px}
.calc .crow{display:flex;justify-content:space-between;margin:3px 0}
.calc .mp{color:var(--p)} .calc .mc{color:var(--c)} .calc .mf{color:var(--f)}
.calc .k{color:var(--kcal);font-weight:700}
.row2{display:flex;gap:8px}
.btn{flex:1;padding:13px;border-radius:11px;border:none;font-size:15px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--c);color:#fff}
.btn-ghost{background:var(--line2);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.date-nav{display:flex;align-items:center;gap:0}
.navbtn{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;padding:0 6px;line-height:1}
.navbtn:disabled{opacity:.25}
.datebtn{background:none;border:none;cursor:pointer;padding:2px 4px;display:flex;align-items:baseline;gap:6px;color:var(--ink)}
.date-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:16px;top:40px}
.mode-pick{display:flex;gap:6px;margin-bottom:14px}
.mode-pick button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;cursor:pointer;color:var(--sub);font-weight:600}
.mode-pick button.on{border-color:var(--c);color:var(--c);background:#eff6ff}
.calc.preview{margin:0 0 14px}

/* report */
.rep-week{display:flex;gap:4px;margin:6px 0 14px}
.rep-day{flex:1;text-align:center}
.rep-bar-wrap{height:70px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
.rep-bar{width:60%;background:var(--c);border-radius:3px 3px 0 0;min-height:2px}
.rep-day .d{font-size:10px;color:var(--sub)}
.rep-day .v{font-size:10px;color:var(--sub);margin-top:1px}
.rep-day.today .d{color:var(--c);font-weight:700}
.rep-card{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:10px}
.rep-card h4{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px}
.rep-line{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.rep-line+.rep-line{border-top:1px solid var(--line2)}
.rep-line .nm{display:flex;align-items:center;gap:6px}
.rep-line .val{font-weight:700}
.rep-line .pct{font-size:11px;padding:1px 6px;border-radius:5px;margin-left:6px}
.pct-ok{background:#ecfdf5;color:var(--ok)}
.pct-warn{background:#fef2f2;color:var(--warn)}
.rep-note{font-size:12.5px;line-height:1.7;color:var(--ink);background:#fffbeb;
  border:1px solid #fde68a;border-radius:10px;padding:11px 13px;margin-bottom:14px}
.rep-note b{color:var(--warn)}
.rep-note.good{background:#ecfdf5;border-color:#a7f3d0}
.rep-note.good b{color:var(--ok)}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="date-nav">
      <button class="navbtn" id="prevDay" title="이전 날">‹</button>
      <button class="datebtn" id="datePick"><span class="hd-title" id="viewTitle">오늘</span><span class="hd-date num" id="date"></span></button>
      <button class="navbtn" id="nextDay" title="다음 날">›</button>
      <input type="date" id="dateInput" class="date-hidden">
    </div>
    <div class="hd-btns">
      <button class="iconbtn" id="btnReport" title="주간 리포트">📊</button>
      <button class="iconbtn" id="btnSettings" title="목표 설정">⚙</button>
    </div>
  </div>
  <div class="tot-kcal"><b class="num" id="totKcal">0</b><span class="goal num" id="goalKcal"></span></div>
  <div class="bar" id="bar"><i class="bp" style="width:0"></i><i class="bc" style="width:0"></i><i class="bf" style="width:0"></i></div>
  <div class="macros">
    <div class="macro"><span class="dot dp"></span><b class="num" id="totP">0</b><span class="g num" id="goalP"></span><span class="lbl">단백질</span></div>
    <div class="macro"><span class="dot dc"></span><b class="num" id="totC">0</b><span class="g num" id="goalC"></span><span class="lbl">탄수</span></div>
    <div class="macro"><span class="dot df"></span><b class="num" id="totF">0</b><span class="g num" id="goalF"></span><span class="lbl">지방</span></div>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-tab="search">검색</button>
  <button class="tab" data-tab="fav">즐겨찾기</button>
  <button class="tab" data-tab="recent">최근</button>
</div>

<div class="searchwrap" id="searchwrap">
  <input class="search" id="q" placeholder="음식 이름 검색 (예: 김밥, 닭가슴살, 고등어)" autocomplete="off">
</div>
<div class="list" id="list"></div>

<div class="today">
  <h2 id="todayHead">오늘 먹은 것</h2>
  <div id="todayList"></div>
</div>

<div class="fab"><button id="addCustom">＋ 목록에 없는 음식 직접 추가</button></div>

<!-- amount modal -->
<div class="modal" id="amtModal">
  <div class="sheet">
    <h3 id="amtName"></h3>
    <div class="msub" id="amtBasis"></div>
    <div class="meal-pick" id="mealPick"></div>
    <div class="field">
      <label>먹은 양</label>
      <input class="num" id="amtInput" type="number" inputmode="decimal" placeholder="그램(g)">
      <div class="qbtns" id="qbtns"></div>
    </div>
    <div class="calc" id="amtCalc"></div>
    <div class="row2">
      <button class="btn btn-ghost" onclick="closeAmt()">취소</button>
      <button class="btn btn-primary" onclick="confirmAmt()">담기</button>
    </div>
  </div>
</div>

<!-- custom food modal -->
<div class="modal" id="customModal">
  <div class="sheet">
    <h3>직접 추가</h3>
    <div class="msub" id="cModeDesc">제품 총량과 성분을 넣으면 100g 기준으로 자동 환산해 저장합니다.</div>
    <div class="mode-pick" id="cModePick">
      <button data-mode="total" class="on">제품 총량 기준</button>
      <button data-mode="per100">100g 기준</button>
    </div>
    <div class="field"><label>음식 이름</label><input id="cName" placeholder="예: OO 진미채"></div>
    <div class="field" id="cWeightField"><label id="cWeightLabel">제품 총량 (g)</label><input class="num" id="cWeight" type="number" inputmode="decimal" placeholder="예: 50"></div>
    <div class="grid2">
      <div class="field"><label id="cKcalLabel">열량 (kcal)</label><input class="num" id="cKcal" type="number" inputmode="decimal"></div>
      <div class="field"><label>단백질 (g)</label><input class="num" id="cP" type="number" inputmode="decimal"></div>
      <div class="field"><label>탄수화물 (g)</label><input class="num" id="cC" type="number" inputmode="decimal"></div>
      <div class="field"><label>지방 (g)</label><input class="num" id="cF" type="number" inputmode="decimal"></div>
    </div>
    <div class="meal-pick" id="cMealPick"></div>
    <div class="calc preview" id="cCalc"></div>
    <div class="row2">
      <button class="btn btn-ghost" onclick="closeCustom()">취소</button>
      <button class="btn btn-ghost" onclick="saveCustom(false)">저장만</button>
    </div>
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-primary" onclick="saveCustom(true)">저장하고 담기</button>
    </div>
  </div>
</div>

<!-- settings modal -->
<div class="modal" id="settingsModal">
  <div class="sheet">
    <h3>일일 목표</h3>
    <div class="msub">이 목표를 기준으로 부족·과잉을 판정합니다. 본인 수치로 바꾸세요.</div>
    <div class="grid2">
      <div class="field"><label>열량 (kcal)</label><input class="num" id="gKcal" type="number" inputmode="decimal"></div>
      <div class="field"><label>단백질 (g)</label><input class="num" id="gP" type="number" inputmode="decimal"></div>
      <div class="field"><label>탄수화물 (g)</label><input class="num" id="gC" type="number" inputmode="decimal"></div>
      <div class="field"><label>지방 (g)</label><input class="num" id="gF" type="number" inputmode="decimal"></div>
    </div>
    <div class="row2" style="margin-top:6px">
      <button class="btn btn-ghost" onclick="closeSettings()">취소</button>
      <button class="btn btn-primary" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<!-- report modal -->
<div class="modal" id="reportModal">
  <div class="sheet">
    <h3>주간 리포트</h3>
    <div class="msub" id="repRange"></div>
    <div id="repBody"></div>
    <div class="row2" style="margin-top:4px">
      <button class="btn btn-ghost" onclick="downloadReport('md')">마크다운 저장</button>
      <button class="btn btn-ghost" onclick="downloadReport('txt')">텍스트 저장</button>
    </div>
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-primary" onclick="closeReport()">닫기</button>
    </div>
  </div>
</div>

<script>
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('kkini_'+k); return v==null?d:JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('kkini_'+k, JSON.stringify(v)) }catch(e){} }
};
let favorites = LS.get('fav', []);
let recent = LS.get('recent', []);
let custom = LS.get('custom', []);
let goals = LS.get('goals', {kcal:2000, p:90, c:250, f:60});
let history = LS.get('history', null);

// migrate old single-day 'today' if present
if(history===null){
  history = {};
  const old = LS.get('today', null);
  if(old && old.date && Array.isArray(old.items)){
    history[old.date] = old.items.map(it=>({...it, meal: it.meal||'기타'}));
    LS.set('history', history);
  }
}
const MEALS = ['아침','점심','저녁','간식'];
function dateStr(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
const realToday = dateStr(new Date());
let viewDate = realToday;
if(!history[realToday]) history[realToday] = [];

function pool(){ return custom.concat(FOODS); }
function findFood(name){ return pool().find(f=>f.name===name); }
function viewItems(){ if(!history[viewDate]) history[viewDate]=[]; return history[viewDate]; }

function updateHeader(){
  const d=new Date(viewDate+'T00:00:00');
  document.getElementById('date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  const yst=dateStr(new Date(Date.now()-86400000));
  let title='기록';
  if(viewDate===realToday) title='오늘';
  else if(viewDate===yst) title='어제';
  else title='';
  document.getElementById('viewTitle').textContent=title;
  document.getElementById('todayHead').textContent=(viewDate===realToday?'오늘':d.toLocaleDateString('ko-KR',{month:'long',day:'numeric'}))+' 먹은 것';
  document.getElementById('nextDay').disabled = viewDate>=realToday;
  const di=document.getElementById('dateInput'); di.value=viewDate; di.max=realToday;
}
function setViewDate(ds){
  if(ds>realToday) ds=realToday;
  viewDate=ds; viewItems();
  updateHeader(); renderTotals(); renderTodayList();
}
function shiftDay(delta){ const d=new Date(viewDate+'T00:00:00'); d.setDate(d.getDate()+delta); setViewDate(dateStr(d)); }

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function clean(n){ return n.replace(/_/g,' ').replace(/\s+/g,' ').trim(); }
function parseWeight(w){ if(!w) return null; const m=String(w).match(/([\d.]+)/); return m?parseFloat(m[1]):null; }
function macrosFor(f, grams){ const r=grams/100; return {kcal:(f.kcal||0)*r, p:(f.protein||0)*r, c:(f.carb||0)*r, f:(f.fat||0)*r}; }
function round(x,d=0){ const m=Math.pow(10,d); return Math.round(x*m)/m; }
function guessMeal(){ const h=new Date().getHours(); if(h<11)return '아침'; if(h<16)return '점심'; if(h<21)return '저녁'; return '간식'; }

function renderTotals(){
  let k=0,p=0,c=0,f=0;
  viewItems().forEach(it=>{ k+=it.kcal; p+=it.p; c+=it.c; f+=it.f; });
  document.getElementById('totKcal').textContent = round(k);
  document.getElementById('goalKcal').textContent = '/ '+goals.kcal+' kcal';
  document.getElementById('totP').textContent = round(p,1);
  document.getElementById('totC').textContent = round(c,1);
  document.getElementById('totF').textContent = round(f,1);
  document.getElementById('goalP').textContent = '/'+goals.p;
  document.getElementById('goalC').textContent = '/'+goals.c;
  document.getElementById('goalF').textContent = '/'+goals.f;
  const gp=p*4, gc=c*4, gf=f*9, sum=gp+gc+gf;
  const bar=document.getElementById('bar').children;
  bar[0].style.width = sum?(gp/sum*100)+'%':'0';
  bar[1].style.width = sum?(gc/sum*100)+'%':'0';
  bar[2].style.width = sum?(gf/sum*100)+'%':'0';
}

let tab='search';
function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  document.getElementById('searchwrap').style.display = (t==='search')?'block':'none';
  renderList();
}
function foodRowHTML(f){
  const on = favorites.includes(f.name)?'on':'';
  const nm = escHtml(clean(f.name));
  const dn = escHtml(f.name);
  const src = f.custom?'<span class="src">내가 추가</span>':(f.src?'<span class="src">'+escHtml(f.src)+'</span>':'');
  return `<div class="row"><div class="row-main">
      <div class="row-name">${nm}${src}</div>
      <div class="row-sub">100g · <span class="k">${round(f.kcal)}kcal</span>
        · <span class="mp">P ${round(f.protein,1)}</span> · <span class="mc">C ${round(f.carb,1)}</span> · <span class="mf">F ${round(f.fat,1)}</span></div>
    </div>
    <button class="star ${on}" data-act="fav" data-name="${dn}">★</button>
    <button class="add" data-act="add" data-name="${dn}">＋</button></div>`;
}
function renderList(){
  const el=document.getElementById('list');
  if(tab==='fav'){
    const items=favorites.map(findFood).filter(Boolean);
    el.innerHTML=items.length?items.map(foodRowHTML).join(''):'<div class="hint">별표를 누르면 여기 모입니다.<br>자주 먹는 음식을 즐겨찾기 해두세요.</div>';
    return;
  }
  if(tab==='recent'){
    const items=recent.map(findFood).filter(Boolean);
    el.innerHTML=items.length?items.map(foodRowHTML).join(''):'<div class="hint">최근 담은 음식이 여기 표시됩니다.</div>';
    return;
  }
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){ el.innerHTML='<div class="hint">먹은 음식을 검색해 담아보세요.<br>총 '+pool().length.toLocaleString()+'개 음식이 등록되어 있습니다.</div>'; return; }
  const qn=q.replace(/\s/g,'');
  const res=pool().filter(f=>{ const n=f.name.toLowerCase(); return n.includes(q)||n.replace(/[_\s]/g,'').includes(qn); }).slice(0,60);
  el.innerHTML=res.length?res.map(foodRowHTML).join(''):'<div class="hint">검색 결과가 없습니다.<br>아래 버튼으로 직접 추가할 수 있습니다.</div>';
}
function toggleFav(name){ const i=favorites.indexOf(name); if(i>=0)favorites.splice(i,1); else favorites.unshift(name); LS.set('fav',favorites); renderList(); }

let curFood=null, curGrams=0, curMeal='점심';
function openAmt(name){
  curFood=findFood(name); if(!curFood)return;
  curMeal=guessMeal();
  document.getElementById('amtName').textContent=clean(curFood.name);
  const unit=(curFood.basis||'100g').includes('ml')?'ml':'g';
  document.getElementById('amtBasis').textContent='100'+unit+' 기준 · '+round(curFood.kcal)+'kcal';
  // meal picker
  const mp=document.getElementById('mealPick'); mp.innerHTML='';
  MEALS.forEach(m=>{ const b=document.createElement('button'); b.textContent=m; if(m===curMeal)b.classList.add('on');
    b.onclick=()=>{ curMeal=m; [...mp.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    mp.appendChild(b); });
  const inp=document.getElementById('amtInput'); inp.value=''; inp.placeholder='그램('+unit+')';
  const qb=document.getElementById('qbtns'); qb.innerHTML='';
  const opts=[]; const w=parseWeight(curFood.weight);
  if(w)opts.push({label:(curFood.custom?'1개 ':'1인분 ')+round(w)+unit, val:w});
  [100,150,200].forEach(v=>opts.push({label:v+unit,val:v}));
  opts.forEach(o=>{ const b=document.createElement('button'); b.className='qbtn'; b.textContent=o.label;
    b.onclick=()=>{ inp.value=round(o.val,1); updateCalc(); [...qb.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    qb.appendChild(b); });
  updateCalc();
  document.getElementById('amtModal').classList.add('on');
  setTimeout(()=>inp.focus(),100);
}
function updateCalc(){
  const g=parseFloat(document.getElementById('amtInput').value)||0; curGrams=g;
  const m=macrosFor(curFood,g);
  document.getElementById('amtCalc').innerHTML=
    `<div class="crow"><span>열량</span><span class="k num">${round(m.kcal)} kcal</span></div>
     <div class="crow"><span class="mp">단백질</span><span class="num">${round(m.p,1)} g</span></div>
     <div class="crow"><span class="mc">탄수화물</span><span class="num">${round(m.c,1)} g</span></div>
     <div class="crow"><span class="mf">지방</span><span class="num">${round(m.f,1)} g</span></div>`;
}
document.getElementById('amtInput').addEventListener('input',updateCalc);
function closeAmt(){ document.getElementById('amtModal').classList.remove('on'); }
function confirmAmt(){
  if(!curFood||!curGrams){ closeAmt(); return; }
  const m=macrosFor(curFood,curGrams);
  viewItems().push({name:curFood.name, grams:curGrams, meal:curMeal,
    kcal:m.kcal, p:m.p, c:m.c, f:m.f, unit:(curFood.basis||'g').includes('ml')?'ml':'g'});
  LS.set('history',history);
  recent=[curFood.name,...recent.filter(n=>n!==curFood.name)].slice(0,30);
  LS.set('recent',recent);
  closeAmt(); renderTotals(); renderTodayList();
}

function renderTodayList(){
  const el=document.getElementById('todayList');
  const items=viewItems();
  if(!items.length){ el.innerHTML='<div class="empty">아직 기록이 없습니다.</div>'; return; }
  let html='';
  MEALS.concat(['기타']).forEach(meal=>{
    const idxs=items.map((it,i)=>({it,i})).filter(x=>(x.it.meal||'기타')===meal);
    if(!idxs.length) return;
    let sk=0,sp=0,sc=0,sf=0; idxs.forEach(x=>{ sk+=x.it.kcal; sp+=x.it.p; sc+=x.it.c; sf+=x.it.f; });
    html+=`<div class="meal-group">
      <div class="meal-head"><span class="meal-name">${meal}</span>
        <span class="meal-sub num">${round(sk)}kcal · P${round(sp)} C${round(sc)} F${round(sf)}</span></div>`;
    idxs.forEach(x=>{
      html+=`<div class="titem"><div class="ti-main">
          <div class="ti-name">${escHtml(clean(x.it.name))}</div>
          <div class="ti-sub num">${round(x.it.grams)}${x.it.unit||'g'} · ${round(x.it.kcal)}kcal</div>
          <div class="ti-macros num"><span class="mp">P ${round(x.it.p,1)}</span> · <span class="mc">C ${round(x.it.c,1)}</span> · <span class="mf">F ${round(x.it.f,1)}</span></div>
        </div><button class="del" data-act="del" data-idx="${x.i}">✕</button></div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}
function removeItem(i){ viewItems().splice(i,1); LS.set('history',history); renderTotals(); renderTodayList(); }

let cMode='total', cCustomMeal='점심';
function setCMode(m){
  cMode=m;
  document.querySelectorAll('#cModePick button').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  const total=m==='total';
  document.getElementById('cModeDesc').textContent = total
    ? '제품 총량과 그 총량의 성분을 넣으면 100g 기준으로 자동 환산해 저장합니다.'
    : '100g 기준 성분을 직접 넣습니다. 제품 1회 용량은 선택 입력입니다.';
  document.getElementById('cWeightLabel').textContent = total ? '제품 총량 (g) · 필수' : '제품 1회 용량 (g) · 선택';
  document.getElementById('cKcalLabel').textContent = total ? '열량 (kcal)' : '열량 (kcal)';
  updateCustomCalc();
}
function updateCustomCalc(){
  const el=document.getElementById('cCalc');
  if(cMode!=='total'){ el.style.display='none'; return; }
  const w=parseFloat(document.getElementById('cWeight').value)||0;
  if(!w){ el.style.display='none'; return; }
  const f=100/w;
  const k=(+document.getElementById('cKcal').value||0)*f;
  const p=(+document.getElementById('cP').value||0)*f;
  const c=(+document.getElementById('cC').value||0)*f;
  const ft=(+document.getElementById('cF').value||0)*f;
  el.style.display='block';
  el.innerHTML=`<div class="crow"><span>100g 환산</span><span class="k num">${round(k)} kcal</span></div>
    <div class="crow"><span class="mp">단백질</span><span class="num">${round(p,1)} g</span></div>
    <div class="crow"><span class="mc">탄수화물</span><span class="num">${round(c,1)} g</span></div>
    <div class="crow"><span class="mf">지방</span><span class="num">${round(ft,1)} g</span></div>`;
}
function openCustom(){
  cCustomMeal=guessMeal(); setCMode('total');
  const mp=document.getElementById('cMealPick'); mp.innerHTML='';
  MEALS.forEach(m=>{ const b=document.createElement('button'); b.textContent=m; if(m===cCustomMeal)b.classList.add('on');
    b.onclick=()=>{ cCustomMeal=m; [...mp.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    mp.appendChild(b); });
  document.getElementById('customModal').classList.add('on');
}
function closeCustom(){ document.getElementById('customModal').classList.remove('on'); }
function saveCustom(andEat){
  const name=document.getElementById('cName').value.trim();
  if(!name){ document.getElementById('cName').focus(); return; }
  const w=parseFloat(document.getElementById('cWeight').value)||0;
  const ik=+document.getElementById('cKcal').value||0, ip=+document.getElementById('cP').value||0,
        ic=+document.getElementById('cC').value||0, iff=+document.getElementById('cF').value||0;
  let per100;
  if(cMode==='total'){
    if(!w){ document.getElementById('cWeight').focus(); return; }
    const f=100/w;
    per100={kcal:round(ik*f,1), protein:round(ip*f,1), carb:round(ic*f,1), fat:round(iff*f,1)};
  } else {
    per100={kcal:ik, protein:ip, carb:ic, fat:iff};
  }
  const food={name, ...per100, basis:'100g', weight:(w?round(w,1)+'g':''), custom:true};
  custom.unshift(food); LS.set('custom',custom);
  if(andEat){
    const eatGrams = w || 100;
    const m=macrosFor(food, eatGrams);
    viewItems().push({name, grams:eatGrams, meal:cCustomMeal, kcal:m.kcal, p:m.p, c:m.c, f:m.f, unit:'g'});
    LS.set('history',history);
    recent=[name,...recent.filter(n=>n!==name)].slice(0,30); LS.set('recent',recent);
  }
  ['cName','cWeight','cKcal','cP','cC','cF'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('cCalc').style.display='none';
  closeCustom();
  if(andEat){ renderTotals(); renderTodayList(); }
  else { setTab('search'); document.getElementById('q').value=name; renderList(); }
}

// settings
function openSettings(){
  document.getElementById('gKcal').value=goals.kcal;
  document.getElementById('gP').value=goals.p;
  document.getElementById('gC').value=goals.c;
  document.getElementById('gF').value=goals.f;
  document.getElementById('settingsModal').classList.add('on');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('on'); }
function saveSettings(){
  goals={ kcal:+document.getElementById('gKcal').value||0, p:+document.getElementById('gP').value||0,
    c:+document.getElementById('gC').value||0, f:+document.getElementById('gF').value||0 };
  LS.set('goals',goals); closeSettings(); renderTotals();
}

// ---------- weekly report ----------
function last7(){
  const days=[]; const base=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(base); d.setDate(base.getDate()-i); days.push(dateStr(d)); }
  return days;
}
function dayTotals(ds){
  const items=history[ds]||[]; let k=0,p=0,c=0,f=0;
  items.forEach(it=>{ k+=it.kcal; p+=it.p; c+=it.c; f+=it.f; });
  return {k,p,c,f, logged:items.length>0};
}
function reportData(){
  const days=last7();
  const rows=days.map(ds=>({ds, ...dayTotals(ds)}));
  const logged=rows.filter(r=>r.logged);
  const n=logged.length||1;
  const avg={ k:logged.reduce((s,r)=>s+r.k,0)/n, p:logged.reduce((s,r)=>s+r.p,0)/n,
    c:logged.reduce((s,r)=>s+r.c,0)/n, f:logged.reduce((s,r)=>s+r.f,0)/n };
  return {days, rows, loggedCount:logged.length, avg};
}
function pctClass(ratio){ return (ratio>=0.9 && ratio<=1.1)?'pct-ok':'pct-warn'; }
function openReport(){
  const R=reportData();
  document.getElementById('repRange').textContent=R.days[0]+' ~ '+R.days[6]+' · 기록 '+R.loggedCount+'/7일';
  // week bars (kcal)
  const maxK=Math.max(...R.rows.map(r=>r.k),1);
  let bars='<div class="rep-week">';
  R.rows.forEach((r,i)=>{
    const h=r.logged?Math.max(r.k/maxK*70,2):0;
    const dow=['일','월','화','수','목','금','토'][new Date(r.ds+'T00:00:00').getDay()];
    const isToday=r.ds===realToday?'today':'';
    bars+=`<div class="rep-day ${isToday}"><div class="rep-bar-wrap"><div class="rep-bar" style="height:${h}px;background:${r.logged?'var(--c)':'var(--line)'}"></div></div>
      <div class="d">${dow}</div><div class="v num">${r.logged?round(r.k):'-'}</div></div>`;
  });
  bars+='</div>';
  // averages vs goal
  const a=R.avg;
  function line(color,label,val,goal,unit){
    const ratio=goal?val/goal:0;
    return `<div class="rep-line"><span class="nm"><span class="dot" style="background:${color}"></span>${label}</span>
      <span><span class="val num">${round(val)}${unit}</span>
      <span class="pct ${pctClass(ratio)}">${goal?round(ratio*100):0}%</span></span></div>`;
  }
  let card=`<div class="rep-card"><h4>하루 평균 (기록된 날 기준) · 목표 대비</h4>`;
  card+=line('var(--kcal)','열량',a.k,goals.kcal,' kcal');
  card+=line('var(--p)','단백질',a.p,goals.p,' g');
  card+=line('var(--c)','탄수화물',a.c,goals.c,' g');
  card+=line('var(--f)','지방',a.f,goals.f,' g');
  card+='</div>';
  // note
  const note=buildNote(R);
  document.getElementById('repBody').innerHTML=bars+card+note;
  document.getElementById('reportModal').classList.add('on');
}
function buildNote(R){
  if(R.loggedCount===0) return '<div class="rep-note">최근 7일간 기록이 없습니다. 며칠 기록하면 분석이 나옵니다.</div>';
  const a=R.avg; const msgs=[];
  const checks=[['단백질',a.p,goals.p],['열량',a.k,goals.kcal],['탄수화물',a.c,goals.c],['지방',a.f,goals.f]];
  checks.forEach(([lbl,val,goal])=>{
    if(!goal) return;
    const r=val/goal;
    if(r<0.9) msgs.push(`<b>${lbl} 부족</b> (평균 ${round(val)}, 목표 ${goal}, ${round(r*100)}%)`);
    else if(r>1.1) msgs.push(`<b>${lbl} 초과</b> (평균 ${round(val)}, 목표 ${goal}, ${round(r*100)}%)`);
  });
  if(!msgs.length) return '<div class="rep-note good">최근 7일 평균이 목표 범위 안에 잘 들어와 있습니다.</div>';
  return '<div class="rep-note">'+msgs.join('<br>')+'</div>';
}
function closeReport(){ document.getElementById('reportModal').classList.remove('on'); }

function buildReportText(md){
  const R=reportData(); const a=R.avg;
  const nl='\n'; let t='';
  const H1=md?'# ':'', H2=md?'## ':'[ ', H2e=md?'':' ]';
  t+=H1+'끼니 주간 리포트'+nl;
  t+=R.days[0]+' ~ '+R.days[6]+'  (기록 '+R.loggedCount+'/7일)'+nl+nl;
  t+=H2+'하루 평균 (기록된 날 기준)'+H2e+nl;
  const rows=[['열량',a.k,goals.kcal,'kcal'],['단백질',a.p,goals.p,'g'],['탄수화물',a.c,goals.c,'g'],['지방',a.f,goals.f,'g']];
  if(md){ t+='| 항목 | 평균 | 목표 | 달성 |'+nl+'|---|---|---|---|'+nl;
    rows.forEach(([l,v,g,u])=>{ t+=`| ${l} | ${round(v)}${u} | ${g}${u} | ${g?round(v/g*100):0}% |`+nl; });
  } else {
    rows.forEach(([l,v,g,u])=>{ t+=`- ${l}: ${round(v)}${u} / 목표 ${g}${u} (${g?round(v/g*100):0}%)`+nl; });
  }
  t+=nl+H2+'일별 열량'+H2e+nl;
  R.rows.forEach(r=>{ const dow=['일','월','화','수','목','금','토'][new Date(r.ds+'T00:00:00').getDay()];
    t+=`- ${r.ds}(${dow}): ${r.logged?round(r.k)+'kcal, P'+round(r.p)+' C'+round(r.c)+' F'+round(r.f):'기록 없음'}`+nl; });
  t+=nl+H2+'평가'+H2e+nl;
  const notes=[];
  [['단백질',a.p,goals.p],['열량',a.k,goals.kcal],['탄수화물',a.c,goals.c],['지방',a.f,goals.f]].forEach(([l,v,g])=>{
    if(!g)return; const rr=v/g;
    if(rr<0.9)notes.push(`${l} 부족 (${round(rr*100)}%)`);
    else if(rr>1.1)notes.push(`${l} 초과 (${round(rr*100)}%)`);
  });
  t+= (notes.length? notes.map(n=>'- '+n).join(nl) : '- 평균이 목표 범위 안에 있습니다.')+nl;
  return t;
}
function downloadReport(fmt){
  const md=fmt==='md';
  const text=buildReportText(md);
  const blob=new Blob([text],{type:'text/'+(md?'markdown':'plain')+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='끼니_주간리포트_'+realToday+(md?'.md':'.txt'); a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

['cWeight','cKcal','cP','cC','cF'].forEach(id=>document.getElementById(id).addEventListener('input',updateCustomCalc));
updateHeader();

});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m)m.classList.remove('on'); }));
renderTotals(); renderTodayList(); renderList();
</script>
